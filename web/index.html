<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b1d22">
<title>Officina Moto</title>
<style>
:root{--bg:#1b1d22;--pan:#262a31;--pan2:#30353e;--txt:#eef0f3;--dim:#9aa3af;--acc:#ff8a1f;--ok:#3ecf6e;--ko:#ff5a52;--blu:#4aa3ff;--oro:#ffd23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto}
#top{display:flex;align-items:center;gap:10px;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;background:#14161a;border-bottom:1px solid #000}
#soldi{font-size:20px;font-weight:800;color:var(--oro);white-space:nowrap}
#fama{flex:1;min-width:0}
#fama .l{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra{height:6px;background:#3a3f48;border-radius:3px;overflow:hidden}
.barra>i{display:block;height:100%;width:0;background:var(--acc)}
#btnMenu{background:none;border:0;color:var(--txt);font-size:22px;padding:2px 6px}
#scena{display:block;width:100%;height:200px;background:#222}
#pannello{flex:1;overflow-y:auto;padding:10px 10px 20px;-webkit-overflow-scrolling:touch}
#tabs{display:flex;background:#14161a;border-top:1px solid #000;padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;background:none;border:0;color:var(--dim);padding:7px 2px 6px;font-size:11px;position:relative}
#tabs button b{display:block;font-size:20px;line-height:1.1}
#tabs button.on{color:var(--acc)}
#tabs .badge{position:absolute;top:3px;right:calc(50% - 20px);background:var(--ko);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;font-weight:700}
h2{font-size:16px;margin:14px 0 8px;color:var(--acc)}
h2:first-child{margin-top:2px}
.card{background:var(--pan);border-radius:12px;padding:10px;margin-bottom:9px;border:1px solid #33383f}
.card.vuoto{border-style:dashed;color:var(--dim)}
.riga{display:flex;align-items:center;gap:8px}
.riga .sp{flex:1;min-width:0}
.tit{font-weight:700}
.sub{font-size:12.5px;color:var(--dim)}
.prezzo{color:var(--oro);font-weight:700;white-space:nowrap}
button.b{background:var(--acc);color:#1b1100;border:0;border-radius:9px;padding:8px 12px;font-weight:700;font-size:14px;white-space:nowrap}
button.b.sec{background:var(--pan2);color:var(--txt);border:1px solid #444b55}
button.b.ok{background:var(--ok);color:#002410}
button.b:disabled{opacity:.4}
button.b.pic{padding:5px 9px;font-size:13px}
.task{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #353a42}
.task:first-of-type{border-top:0}
.task .n{flex:1;min-width:0}
.task.fatto{color:var(--dim);text-decoration:line-through}
.pb{height:5px;background:#3a3f48;border-radius:3px;overflow:hidden;margin-top:4px}
.pb>i{display:block;height:100%;width:0;background:var(--blu)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:#3a3f48;color:#cfd5dd;margin-right:4px}
.tag.cl{background:#1f4b7a}.tag.us{background:#6b4a12}.tag.cu{background:#5b2a6e}.tag.pi{background:#7a1f2a}.tag.ta{background:#1f6b4a}
.mecc{font-size:12.5px;color:#9fd0ff}
.griglia{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tr{display:flex;gap:9px;align-items:center;padding:7px 0;border-top:1px solid #353a42}
.tr .ic{font-size:22px;width:30px;text-align:center;filter:grayscale(1);opacity:.35}
.tr.si .ic{filter:none;opacity:1}
.tr.no .tit{color:var(--dim)}
.sw{display:flex;align-items:center;gap:8px;font-size:14px}
.sw input{width:20px;height:20px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:20;padding:14px}
#modal[hidden]{display:none}
#modal .box{background:var(--pan);border-radius:16px;padding:16px;width:100%;max-width:440px;border:1px solid #444b55;max-height:92vh;overflow-y:auto}
#modal h3{margin:0 0 4px;font-size:18px}
#modal .spieg{font-size:13px;color:#cfd5dd;background:#1d2026;border-radius:9px;padding:8px 10px;margin:8px 0}
.mg{position:relative;margin:10px auto;user-select:none;touch-action:manipulation}
.bull{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d7dbe0,#7d858f);border:3px solid #555;font-weight:800;font-size:18px;color:#222;display:flex;align-items:center;justify-content:center}
.bull.ok{background:radial-gradient(circle at 35% 35%,#b9f5cc,#2e9d55);border-color:#1d6b38}
.bull.ko{background:#ff5a52}
.reg{height:46px;background:#3a3f48;border-radius:10px;position:relative;overflow:hidden}
.reg .z{position:absolute;top:0;bottom:0;background:rgba(62,207,110,.55);border-left:2px solid var(--ok);border-right:2px solid var(--ok)}
.reg .ago{position:absolute;top:-2px;bottom:-2px;width:5px;margin-left:-2px;background:#fff;box-shadow:0 0 6px #fff}
.serb{width:120px;height:170px;margin:6px auto;border:3px solid #9aa3af;border-radius:10px 10px 14px 14px;position:relative;overflow:hidden;background:#1d2026}
.serb .liq{position:absolute;left:0;right:0;bottom:0;height:0}
.serb .lin{position:absolute;left:0;right:0;border-top:2px dashed #fff;font-size:10px;color:#fff;padding-left:3px}
.opz{display:block;width:100%;text-align:left;margin:6px 0;background:var(--pan2);color:var(--txt);border:1px solid #444b55;border-radius:10px;padding:11px;font-size:15px}
.opz.ko{background:#5a2522;border-color:var(--ko);color:#ffb3ae}
.msg{min-height:20px;text-align:center;font-weight:700;margin:6px 0}
.msg.ok{color:var(--ok)}.msg.ko{color:var(--ko)}
#toasts{position:fixed;left:0;right:0;top:calc(52px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:30}
.toast{background:#101215ee;border:1px solid var(--acc);color:var(--txt);border-radius:12px;padding:8px 14px;font-size:14px;max-width:92%;animation:tin .25s ease-out}
.toast.tr{border-color:var(--oro)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
.classifica{width:100%;border-collapse:collapse;font-size:13px}
.classifica td{padding:3px 4px;border-top:1px solid #353a42}
.classifica tr.noi td{color:var(--acc);font-weight:700}
.nota{font-size:12px;color:var(--dim);margin-top:6px}
textarea{width:100%;height:90px;background:#1d2026;color:var(--txt);border:1px solid #444b55;border-radius:8px;font-size:12px}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="soldi">€ 0</div>
    <div id="fama"><div class="l" id="famaL">Fama 0</div><div class="barra"><i id="famaB"></i></div></div>
    <button id="btnMenu" data-act="menu" aria-label="Menu">⚙️</button>
  </div>
  <canvas id="scena"></canvas>
  <div id="pannello"></div>
  <nav id="tabs">
    <button data-tab="officina" class="on"><b>🔧</b>Officina</button>
    <button data-tab="clienti"><b>🧑</b>Clienti</button>
    <button data-tab="mercato"><b>🏍️</b>Usato</button>
    <button data-tab="negozio"><b>🛒</b>Compra</button>
    <button data-tab="corse"><b>🏁</b>Corse</button>
    <button data-tab="traguardi"><b>🏆</b>Traguardi</button>
  </nav>
</div>
<div id="modal" hidden><div class="box" id="mbox"></div></div>
<div id="toasts"></div>
<script src="gioco.js"></script>
</body>
</html>
